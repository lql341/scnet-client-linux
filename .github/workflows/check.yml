name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          for f in scripts/build-linux.sh scripts/check-upstream.sh scripts/check-docs.sh \
                   packaging/launcher.sh packaging/debian/postinst packaging/debian/postrm; do
            bash -n "$f"
          done

      - name: Node syntax
        run: |
          node --check scripts/patch-vendor.cjs
          node --check scripts/smoke-native.cjs
          node --check scripts/window-controls.js

      - name: Python syntax
        run: python3 -m py_compile scripts/extract-icons.py

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/build-linux.sh scripts/check-upstream.sh \
            scripts/check-docs.sh packaging/launcher.sh \
            packaging/debian/postinst packaging/debian/postrm

      - name: Package metadata
        run: |
          sudo apt-get install -y -qq desktop-file-validate
          desktop-file-validate packaging/debian/scnet-client.desktop
          # The control template must carry every field dpkg requires.
          for field in Package Version Section Priority Architecture Installed-Size \
                       Maintainer Depends Description; do
            grep -q "^$field:" packaging/debian/control.in \
              || { echo "::error::control.in lacks $field"; exit 1; }
          done
          echo ok

      - name: Documentation stays in step
        run: scripts/check-docs.sh

      - name: Icon extraction works
        run: |
          # The screenshot doubles as a decodable PNG fixture for the resampler path.
          python3 - <<'PY'
          import struct, sys
          data = open('docs/assets/screenshot-linux.png', 'rb').read()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'screenshot is not a PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (1200, 741), (width, height)
          print('screenshot ok', width, height)
          PY

      - name: Policy - no vendor binaries or build outputs
        run: |
          if git ls-files | grep -Ei '\.(zip|dmg|exe|deb|appimage|whl|tgz|tar\.gz)$|^app/|^build/|node_modules/'; then
            echo "::error::vendor binary or build output is tracked"
            exit 1
          fi
          echo ok

      - name: Policy - documented files exist
        run: |
          for f in VERSION CHANGELOG.md README.md README.zh-CN.md LICENSE \
                   scripts/build-linux.sh scripts/versions.env \
                   scripts/check-upstream.sh scripts/check-docs.sh \
                   scripts/patch-vendor.cjs scripts/smoke-native.cjs \
                   scripts/window-controls.js scripts/extract-icons.py \
                   packaging/launcher.sh packaging/debian/control.in \
                   packaging/debian/scnet-client.desktop \
                   packaging/debian/postinst packaging/debian/postrm \
                   docs/README.md docs/design.md docs/design.zh-CN.md \
                   docs/verification.md docs/verification.zh-CN.md \
                   docs/extension-design.md docs/extension-design.zh-CN.md \
                   docs/assets/screenshot-linux.png; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          echo ok
